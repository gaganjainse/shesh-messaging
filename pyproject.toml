[project]
name = "shesh-messaging"
version = "0.1.0"
description = "Shesh Soma — messaging bridges Telegram/Signal as isolated opt-in services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shesh-messaging-mcp = "shesh_messaging.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
