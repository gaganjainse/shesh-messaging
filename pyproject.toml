[project]
name = "shesh-messaging"
version = "0.1.0"
description = "Shesh Soma — messaging bridges Telegram/Signal as isolated opt-in services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4", "shesh-audit>=0.1", "shesh-secrets>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[project.scripts]
shesh-messaging-mcp = "shesh_messaging.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. See shesh-ecosystem/docs (2026-08-12 silent-failure sweep).
extend-select = ["BLE", "TRY"]
[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
